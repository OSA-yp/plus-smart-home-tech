spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/delivery-db
    username: delivery_user
    password: delivery_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: 0

eureka:
  client:
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname:localhost}:${eureka.instance.port:8761}/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      warehouse:
        connectTimeout: 2000
        readTimeout: 2000
      order:
        connectTimeout: 2000
        readTimeout: 2000
