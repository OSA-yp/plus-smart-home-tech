management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

grpc:
  server:
    port: 59091


app:
  kafka:
    producer:
      bootstrap-servers: localhost:9092
    topics:
      sensor-events: telemetry.sensors.v1
      hub-events: telemetry.hubs.v1